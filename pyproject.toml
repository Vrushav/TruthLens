[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truthlens"
version = "1.0.0"
description = "A CLI tool that evaluates the trustworthiness of AI-generated and developer-written Python code using syntax, runtime, security, and hallucination analysis."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

authors = [
    { name = "Vrushav Patel" }
]

keywords = [
    "ai",
    "hallucination",
    "security",
    "python",
    "code-analysis",
    "trust",
    "static-analysis",
    "developer-tools"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Vrushav/TruthLens"
Repository = "https://github.com/Vrushav/TruthLens"
Issues = "https://github.com/Vrushav/TruthLens/issues"

[project.scripts]
truthlens = "truthlens.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["truthlens*", "src*"]

exclude = [
    "tests*",
    "archive*",
    "reports*",
    "docs*",
    "assets*",
    "examples*"
]

[tool.setuptools.package-data]
"src" = [
    "knowledge/*.json"
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }